name: fly-tracking
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.11
  - scikit-learn>=1.3
  - pyyaml>=6.0
  - ipython>=8.0
  - jupyter>=1.0
  - matplotlib>=3.7
  - colorcet>=3.0
  - filterpy>=1.4
  - pip:
    - opencv-python>=4.8
    - supervision>=0.18
    - inference-sdk>=0.13   # lightweight HTTP client; full `inference` server not needed
    - plotly>=5.18
    - PyQt5>=5.15
    - PySide6>=6.6
    - kaleido>=0.2
