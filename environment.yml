# Conda environment for the fly-tracking pipeline.
name: fly-tracking
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.11
  - scikit-learn>=1.3
  - umap-learn>=0.5
  - scikit-posthocs>=0.9
  - pyyaml>=6.0
  - ruamel.yaml>=0.18     # comment-preserving YAML writes (scripts/app.py edits config.yaml)
  - ipython>=8.0
  - jupyter>=1.0
  - matplotlib>=3.7
  - colorcet>=3.0
  - filterpy>=1.4         # Kalman primitives (src/kalmanfilter.py, src/ocsort.py)
  - scikit-image>=0.21    # watershed bbox splitting (src/watershed_split.py; enabled in config.yaml)
  - ffmpeg                # H.264/.m4v decode, *-converted.mp4 prep, notebook Video preview
  - pytest>=7.0           # tests/ (README verification)
  - jupyterlab>=4.0         # notebooks/ (README: jupyter lab …)
  - lap>=0.5.12             # fast Jonker-Volgenant matching in OC-SORT (scipy fallback if missing)
  - pip:
    - opencv-python>=4.8
    - supervision>=0.18
    - inference-sdk>=0.13   # lightweight HTTP client; full `inference` server not needed
    - plotly>=5.18
    - PyQt5>=5.15
    - PySide6>=6.6
    - kaleido>=0.2
    - -e external/TrackEval  # HOTA scoring in run_tracking (parameter_tuning/run_hota.py)
