# Copy this file to creds_config.yaml and fill in your own values.
# creds_config.yaml is gitignored so your real keys never get committed.

# Roboflow private API key (found in Roboflow Settings -> API Keys).
API_KEY: "YOUR_ROBOFLOW_API_KEY_HERE"

# Optional: override roboflow.model_id from config.yaml.
# Format: "<workspace>/<version>" exactly as Roboflow shows it.
# Leave commented out to use the value from config.yaml.
# MODEL_ID: "your-workspace/1"
