# DEPRECATED: parameters for the post-hoc tracklet-stitching pipeline.
# Read at import time by legacy/stitching.py.
# The active pipeline (notebooks/01_tracking_pipeline.ipynb,
# scripts/run_tracking.py, scripts/run_batch_tracking_pipeline.py) does not
# read this file. Do not add anything here unless you are reviving the
# deprecated stitching grid search.

# Iterative Hungarian linking. Each round, candidate matches are accepted as a
# cost-ordered prefix that minimizes the sum of link_scores plus an asymmetric
# deviance penalty. Cost = weighted sum of extrapolation + direction + behavioral terms.
stitching_mode: per_vial       # per_vial | general
stop_mode: converge            # converge | cap | fixed
max_rounds: 10                 # used when stop_mode == fixed
w_under: 15                    # penalty per extra ID above expected (under-merging)
w_over: 2.0                    # penalty per missing ID below expected (over-merging)
vial_count_cap: 7              # per_vial + stop_mode=cap: stop at this many IDs per vial
general_count_cap: 56          # general + stop_mode=cap: stop at this many total IDs

# Behavioral / feature parameters (consumed only by legacy stitching).
fps: 30                        # video fps (for px to px/s conversion)
pause_threshold: 1.0           # px/s below this counts as a pause
edge_fraction: 0.10            # wall-proximity zone as fraction of vial w/h
min_points_for_scale: 10       # min tracklet length to contribute to feature scales
expected_per_vial: 7           # ground-truth fly count per vial
short_track_frac: 0.10         # tracklets below this fraction of num_frames flagged short

link_score_weights:            # 0 disables a term
  extrap: 0.4
  direction: 0.3
  behavioral: 0.3
direction_weights:             # sub-weights inside direction term (sum = 1.0)
  heading_vs_gap: 0.7
  overall_vs_overall: 0.30
behavioral_weights:            # per-feature weights for behavioral dissimilarity
  median_velocity: 1.0
  pause_fraction: 1.0
  mean_turning_angle: 1.0
  mean_angular_velocity: 1.0
  mean_acceleration: 1.0
  n_large_displacements: 1.0
  tortuosity: 1.0
