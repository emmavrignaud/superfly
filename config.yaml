# Default pipeline parameters — override on the CLI or in notebook cells.
# See scripts/run_tracking.py --help and scripts/run_classification.py --help.

tracker:
  confidence: 0.03
  track_activation_threshold: 0.10
  lost_track_buffer: 180         # max frames a track can be lost before being dropped
  minimum_matching_threshold: 0.2
  minimum_consecutive_frames: 3
  min_area: 40                   # px^2; detections smaller than this are ignored
  asso_func: diou               # association function: hmiou (recommended) or iou
  brownian_pos_noise: 5.0       # scale factor on Q[cx] and Q[cy]; 1.0 = original, increase to tolerate saccades

stitching:
  stitching_mode: per_vial       # per_vial: stitch within each vial independently | general: stitch across all vials (cross-vial links still forbidden)
  vial_count_cap: 7             # per_vial mode: stop when active IDs per vial ≤ this
  general_count_cap: 56          # general mode: stop when total active IDs ≤ this
  fps: 30
  pause_threshold: 1.0
  edge_fraction: 0.10
  min_points_for_scale: 10
  expected_per_vial: 7             # ground-truth fly count per vial; used by stitching objectives
  short_track_frac: 0.10           # tracks shorter than this fraction of num_frames are flagged
  link_score_weights:
    extrap: 0.45
    direction: 0.40
    behavioral: 0.15            # for later: add a gap penalty term :) 
  direction_weights:
    heading_vs_gap: 0.50        # weight for: A's final heading vs. gap vector
    overall_vs_overall: 0.50    # weight for: A's overall direction vs. B's overall direction
  behavioral_weights:           # per-feature weights for weighted Euclidean dissimilarity
    median_velocity: 1.0
    pause_fraction: 1.0
    mean_turning_angle: 1.0
    mean_angular_velocity: 1.0
    mean_acceleration: 1.0
    n_large_displacements: 1.0
    tortuosity: 1.0

preprocessing:
  bg_gain: 1.2
  bg_white_level: 245
  bg_percentile: 85.0            # percentile used for background estimation (85-90 recommended)
  bg_sample_stride: 1            # use every N-th frame for background estimation
  default_end: 700               # default upper frame bound shown in the GUI slider
  codec: mp4v

visualization:
  fps_out: 30
  radius: 5
  show_ids: true

roi:
  snap_threshold_pct: 0.01   # snap zone as a fraction of the last drawn box height
  snap_enabled: true          # default on; press S in the GUI to toggle per-vial
