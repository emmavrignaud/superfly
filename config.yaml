# Default pipeline parameters — override via CLI or notebook.

roboflow:
  # Roboflow hosted model id: ``<workspace>/<version>`` (same string Roboflow shows for the model).
  # Optional override: set MODEL_ID in creds_config.yaml (same format).
  model_id: "flies-123/5"
  # Base URL for InferenceHTTPClient (must match Roboflow's deploy snippet for YOUR project):
  #   - https://serverless.roboflow.com  → Serverless Hosted API (Roboflow docs / deploy UI often show this host).
  #   - https://detect.roboflow.com      → Older hosted inference host; only use if YOUR Roboflow example code still uses detect.roboflow.com.
  # Rule: copy the hostname from the official inference example Roboflow gives you after deploy — do not guess.
  inference_api_url: "https://serverless.roboflow.com"

video:
  # Properties of the input video. Used by tracking + diagnostics.
  fallback_fps: 30   # used only when cv2.CAP_PROP_FPS is missing/unreadable

tracker:
  # RF-DETR detections + OC-SORT association into tracklets.
  detection_confidence_rfdetr: 0.4   # RF-DETR output threshold
  confidence: 0.55                   # tracker match threshold (0.3–0.5 typical)
  track_activation_threshold: 0.10   # min conf to open a new track
  lost_track_buffer: 400             # frames a track may go unseen before drop
  minimum_matching_threshold: 0.2   # min association score to keep a match
  minimum_consecutive_frames: 1      # frames needed to confirm a new track
  min_area: 20                       # px²; smaller detections discarded
  asso_func: diou                    # iou | giou | diou | ciou | hmiou
  brownian_pos_noise: 15             # Kalman Q[cx,cy] scale; ↑ tolerates saccades
  aspect_weight: 0.05               # bonus for matching boxes of similar aspect ratio; 0 = disabled, try 0.05–0.2
  behavioral_weight: 0.05           # bonus for speed-plausibility + scale-consistency; 0 = disabled, try 0.05–0.15
  behavioral_weight_overlap: 0.30   # behavioural weight used only when detections overlap; None falls back to behavioral_weight
  jump_factor: 2.0                  # round-2 velocity scale + bbox inflation (how far/wide to search)
  jump_iou_threshold: 0.05          # looser IoU threshold for jump round
  jump_inertia: 0.05                # reduced OCM weight for jump round (direction less reliable after a jump)
  inertia: 0.2                      # round-1 direction consistency weight (OCM); ↑ penalises detections not in tracker's heading direction
  delta_t: 3                        # frames lookback to compute tracker velocity direction for OCM
  overlap_iou_scale: 0.1            # IoU is multiplied by this when detections overlap; suppresses positional signal so behavioral bonus dominates
  edge_fraction: 0.1                # detections within this fraction of vial wall excluded from overlap handling
  expected_count: null              # total expected flies (e.g. 42); enables count-aware spawning when set; null = disabled
  w_under: 15.0                     # spawning penalty per tracker below expected_count (heavy — missing a fly is bad)
  w_over: 2.0                       # spawning penalty per tracker above expected_count (light — ghost tracks are tolerable)

pipeline:
  # Cross-cutting parameters for the active tracking pipeline.
  # (Post-hoc stitching parameters now live in legacy/stitching_config.yaml.)
  expected_per_vial: 7   # ground-truth fly count per vial; used by run_diagnostics

relink:
  # Second-round re-linking: swap tracklet segments at frames where ≥2 trackers
  # simultaneously had a low association score (below their own per-track median).
  min_length: 10                    # min observations for a tracker to be considered
  inconsistency_threshold: 0.4     # reserved for future use (currently unused)
  swap_threshold: 0.05             # min total cost improvement to accept a swap
  confidence_weight: 0.0           # how strongly the split-frame IoU penalises swapping; 0 = ignore (high IoU at overlap is a false signal)
  behavioral_weights:
    median_speed:          0.3     # weak signal for slow/old flies — down-weighted
    pause_fraction:        1.0
    mean_turning_angle:    2.0     # overlap often causes path deflection — up-weighted
    mean_angular_velocity: 1.5
    mean_acceleration:     1.0
    n_large_displacements: 1.0
    tortuosity:            2.0     # overlap deflects trajectory — up-weighted

preprocessing:
  # Per-pixel percentile background, divided out and rescaled to white.
  bg_gain: 1.2                   # post-division gain
  bg_white_level: 245            # target background value (0–255)
  bg_percentile: 85.0            # percentile over time per pixel (85–90)
  bg_sample_stride: 1            # use every N-th frame for estimation
  codec: mp4v                    # FourCC for preprocessed output

visualization:
  # Overlay: diagonal crosshair on the fly + off-body ID chip with leader line.
  overlay_source: raw_cropped  # raw_cropped | processed — substrate for the overlay
  fps_out: 30              # output video fps
  show_ids: true           # false = crosshair only
  tick_len: 2              # half-length of crosshair arm (px); integer — OpenCV stroke width
  tick_thick: 1            # crosshair stroke (px); must be int for cv2.line
  chip_font_scale: 0.32    # OpenCV font scale for the ID
  label_offset_x: 10       # chip offset from centroid, x (px, +right)
  label_offset_y: -10      # chip offset from centroid, y (px, −up)
  chip_pad: 1              # padding inside the chip (px)
  leader_thick: 1          # leader line stroke (px)
  show_unmatched_detections: true   # red box around RF-DETR detections no track covered
  unmatched_tolerance_k: 2.0         # bbox padding = k × std of detection-box sides

roi:
  # Per-vial ROI; cached in roi_library/. Snapping aligns boxes vertically.
  use_saved_roi: true         # false = always open GUI to redraw
  snap_threshold_pct: 0.005   # snap zone as fraction of last box height
  snap_enabled: true          # press 'S' in GUI to toggle per-vial
latent_space:
  # Latent-space preprocessing and dimensionality controls.
  use_pca: true
  pca_explained_variance: 0.95
  representation_method: baseline   # baseline | autoencoder
  umap_n_components: 3
  seed: 42
  autoencoder:
    latent_dim: 64
    hidden_dims: [512, 256]
    epochs: 300
    batch_size: 64
    learning_rate: 0.001
    weight_decay: 0.00001
    val_fraction: 0.2
    patience: 30
    verbose: true